<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện nghe tiếng Anh</title>
<style>
:root{--ink:#14213d;--mute:#5b6577;--bg:#f4f7fb;--card:#fff;--line:#dde3ee;--ok:#1f8a5b;--bad:#c9403a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:2rem;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 28px;max-width:60ch}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #3a6fd8;outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lv{--c:#2a9d8f;text-align:left;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:10px;padding:18px 20px;display:flex;gap:16px;align-items:center;transition:transform .15s,box-shadow .15s}
.lv:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,33,61,.1)}
.badge{flex:none;width:64px;height:64px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.lv h2{margin:0;font-size:1.1rem}
.lv p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
.lv .done{color:var(--ok);font-weight:600}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fff}
.chip{background:var(--c);color:#fff;border-radius:99px;padding:2px 12px;font-weight:700;font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.player{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:1.6rem}
.speed button{border:1px solid var(--line);background:#fff;padding:6px 14px}
.speed button:first-child{border-radius:8px 0 0 8px}.speed button:last-child{border-radius:0 8px 8px 0}
.speed button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.meta{color:var(--mute);font-size:.9rem}
.link{background:none;border:0;color:#3a6fd8;text-decoration:underline;padding:0}
.script{margin:14px 0 0;padding:14px;background:var(--bg);border-radius:8px;font-size:1.05rem;display:none}
.script.on{display:block}
.q{margin:0 0 22px}
.q h3{font-size:1.02rem;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:6px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:#e8f6ef}
.opt.wrong{border-color:var(--bad);background:#fbeceb}
.why{font-size:.9rem;color:var(--mute);margin:4px 0 0;min-height:1.3em}
.result{text-align:center;display:none}
.result.on{display:block}
.result strong{font-size:1.6rem}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px}
.btn{border:0;border-radius:8px;padding:10px 18px;background:var(--ink);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.warn{background:#fff4d6;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:none}
@media(max-width:620px){.grid{grid-template-columns:1fr}h1{font-size:1.6rem}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const LESSONS=[
{lv:"A1",c:"#2a9d8f",title:"Giới thiệu bản thân",topic:"Người mới bắt đầu",
text:"Hi, my name is Linh. I am twelve years old. I live in Hanoi with my mother, my father and my little brother. I like cats and I like music.",
qs:[
{q:"Linh bao nhiêu tuổi?",o:["10","12","14"],a:1,w:"Cô bé nói: \"I am twelve years old.\""},
{q:"Linh sống ở đâu?",o:["Hà Nội","Huế","Đà Nẵng"],a:0,w:"\"I live in Hanoi.\""},
{q:"Linh thích gì?",o:["Chó và thể thao","Mèo và âm nhạc","Sách và phim"],a:1,w:"\"I like cats and I like music.\""}]},
{lv:"A2",c:"#e0952a",title:"Cuối tuần của Nam",topic:"Sơ cấp",
text:"Last Saturday, Nam woke up at seven o'clock. He had breakfast and then played football with his friends in the park. In the afternoon it rained, so he stayed at home and watched a movie. In the evening his grandmother cooked fish soup for the whole family.",
qs:[
{q:"Buổi sáng Nam làm gì?",o:["Xem phim","Đá bóng ở công viên","Nấu ăn"],a:1,w:"\"played football with his friends in the park.\""},
{q:"Vì sao buổi chiều Nam ở nhà?",o:["Trời mưa","Nam bị ốm","Nam phải học bài"],a:0,w:"\"it rained, so he stayed at home.\""},
{q:"Ai nấu bữa tối?",o:["Mẹ","Bà","Nam"],a:1,w:"\"his grandmother cooked fish soup.\""}]},
{lv:"B1",c:"#3a6fd8",title:"Đặt phòng khách sạn",topic:"Trung cấp",
text:"Good morning. I'd like to book a room for two nights, please. Certainly. Would you like a single or a double room? A double, please. And is breakfast included? Yes, breakfast is included, but parking costs ten dollars a day. That's fine. I'll arrive on Friday evening, around eight.",
qs:[
{q:"Khách muốn ở bao lâu?",o:["Một đêm","Hai đêm","Ba đêm"],a:1,w:"\"a room for two nights.\""},
{q:"Khoản nào KHÔNG nằm trong giá phòng?",o:["Bữa sáng","Chỗ đậu xe","Cả hai"],a:1,w:"Bữa sáng đã gồm, còn đậu xe tính 10 đô mỗi ngày."},
{q:"Khi nào khách đến?",o:["Thứ Sáu, khoảng 8 giờ tối","Thứ Sáu, khoảng 8 giờ sáng","Thứ Bảy, khoảng 8 giờ tối"],a:0,w:"\"on Friday evening, around eight.\""}]},
{lv:"B2",c:"#8e4fc9",title:"Làm việc từ xa",topic:"Trung cao cấp",
text:"More and more companies are allowing employees to work from home at least part of the week. Supporters argue that it saves commuting time and improves work-life balance. However, critics point out that remote workers can feel isolated, and that spontaneous collaboration often suffers. As a compromise, many firms now adopt a hybrid model, with two or three office days each week.",
qs:[
{q:"Người ủng hộ cho rằng lợi ích chính là gì?",o:["Lương cao hơn","Tiết kiệm thời gian đi lại và cân bằng cuộc sống","Ít họp hơn"],a:1,w:"Họ nói nó tiết kiệm thời gian đi lại và cải thiện cân bằng công việc – cuộc sống."},
{q:"Người phản đối lo ngại điều gì?",o:["Chi phí điện nước","Cảm giác cô lập và giảm hợp tác tự nhiên","Máy tính chậm"],a:1,w:"\"feel isolated\" và \"spontaneous collaboration often suffers\"."},
{q:"Giải pháp dung hòa được nhắc đến?",o:["Làm việc 4 ngày/tuần","Mô hình kết hợp, 2–3 ngày ở văn phòng","Chỉ làm tại nhà"],a:1,w:"\"a hybrid model, with two or three office days each week.\""}]}
];
const best={},app=document.getElementById("app");
let rate=1;

function home(){
  speechSynthesis&&speechSynthesis.cancel();
  app.innerHTML=`<h1>Luyện nghe tiếng Anh</h1>
  <p class="sub">Chọn một cấp độ, nghe bài rồi trả lời câu hỏi. Mỗi cấp độ có một bài.</p>
  <div class="grid">${LESSONS.map((l,i)=>`
    <button class="lv" style="--c:${l.c}" data-i="${i}">
      <span class="badge">${l.lv}</span>
      <span><h2>${l.title}</h2><p>${l.topic} · ${l.qs.length} câu hỏi</p>
      <p class="${best[i]!=null?'done':''}">${best[i]!=null?'Điểm cao nhất: '+best[i]+'/'+l.qs.length:'Chưa làm'}</p></span>
    </button>`).join("")}</div>`;
  app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>lesson(+b.dataset.i));
}

function lesson(i){
  const L=LESSONS[i];let plays=0,answered=0,score=0;
  app.innerHTML=`<div style="--c:${L.c}">
  <div class="top"><button class="back">← Cấp độ</button><span class="chip">${L.lv}</span><strong>${L.title}</strong></div>
  <div class="panel">
    <div class="warn" id="warn">Trình duyệt này chưa hỗ trợ phát giọng đọc. Hãy bấm "Hiện bài nghe" để đọc nội dung.</div>
    <div class="player">
      <button class="play" id="play" aria-label="Phát bài nghe">▶</button>
      <div><div class="speed" role="group" aria-label="Tốc độ">
        <button data-r=".7" aria-pressed="false">Chậm</button><button data-r="1" aria-pressed="true">Thường</button></div>
        <div class="meta" id="cnt">Đã nghe 0 lần</div></div>
      <button class="link" id="tg">Hiện bài nghe</button>
    </div>
    <p class="script" id="sc">${L.text}</p>
  </div>
  <div class="panel" id="qs">${L.qs.map((q,n)=>`
    <div class="q" data-n="${n}"><h3>${n+1}. ${q.q}</h3>
    ${q.o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join("")}
    <p class="why" aria-live="polite"></p></div>`).join("")}</div>
  <div class="panel result" id="res"></div></div>`;

  const $=s=>app.querySelector(s),ok="speechSynthesis"in window;
  if(!ok)$("#warn").style.display="block";
  $(".back").onclick=home;
  $("#tg").onclick=()=>{const s=$("#sc").classList.toggle("on");$("#tg").textContent=s?"Ẩn bài nghe":"Hiện bài nghe"};
  app.querySelectorAll(".speed button").forEach(b=>b.onclick=()=>{
    rate=+b.dataset.r;app.querySelectorAll(".speed button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#play").onclick=()=>{
    if(!ok)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(L.text);
    u.lang="en-US";u.rate=rate;
    const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
    u.onstart=()=>$("#play").textContent="■";
    u.onend=u.onerror=()=>$("#play").textContent="▶";
    plays++;$("#cnt").textContent="Đã nghe "+plays+" lần";
    speechSynthesis.speak(u);
  };
  app.querySelectorAll(".q").forEach(box=>{
    const q=L.qs[+box.dataset.n];
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,good=k===q.a;
      box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      box.querySelectorAll(".opt")[q.a].classList.add("right");
      if(!good)b.classList.add("wrong");
      box.querySelector(".why").textContent=(good?"Chính xác. ":"Chưa đúng. ")+q.w;
      score+=good;answered++;
      if(answered===L.qs.length)finish();
    });
  });
  function finish(){
    best[i]=Math.max(best[i]||0,score);
    const r=$("#res");r.classList.add("on");
    r.innerHTML=`<strong>${score}/${L.qs.length}</strong>
    <p>${score===L.qs.length?"Xuất sắc! Bạn có thể sang cấp độ tiếp theo.":"Hãy nghe lại và đối chiếu với bài nghe để rõ hơn."}</p>
    <div class="row"><button class="btn alt" id="again">Làm lại</button>
    ${i<LESSONS.length-1?'<button class="btn" id="next">Cấp độ tiếp theo</button>':'<button class="btn" id="hm">Về danh sách</button>'}</div>`;
    $("#again").onclick=()=>lesson(i);
    const n=$("#next");if(n)n.onclick=()=>lesson(i+1);
    const h=$("#hm");if(h)h.onclick=home;
    r.scrollIntoView({behavior:"smooth",block:"center"});
  }
}
if("speechSynthesis"in window)speechSynthesis.getVoices();
home();
</script>
</body>
</html>
